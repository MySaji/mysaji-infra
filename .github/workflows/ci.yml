name: Infrastructure CI

on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install pinned lint tools
        run: python -m pip install -r scripts/requirements.txt
      - name: Repository guardrails
        run: python scripts/validate.py
      - name: YAML lint
        run: python -m yamllint .
      - name: Whitespace validation
        run: git diff --check
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Scan files and Git history with checksum-pinned Gitleaks
        run: python scripts/scan_secrets.py
